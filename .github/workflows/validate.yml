name: Validar catálogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar índice, tags, commits e origens
        # mode=index executa validate-index com --fetch, conforme o contrato da action.
        uses: In-House-Technology/ihapp-tools@c2113f6a1f5cb33c40eba8213a1e272227452650
        with:
          mode: index
          path: catalog.yaml
          org: In-House-Technology
